
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-advanced-lib"
version = "0.1.0"
description = "An advanced Python library demonstrating decorators, generators, context managers, and metaclasses"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
